name: taskflow
description: "A polished multi-screen Flutter task manager with Firebase Auth, Firestore CRUD, Provider state management, and Light/Dark theming."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0

  # Animations
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1

  # Extra features
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
